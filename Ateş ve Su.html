<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ateş ve Su</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:#12121a;color:#eee;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center}
h1{margin:10px 0 2px;font-size:22px}
#info{font-size:14px;opacity:.85;margin-bottom:6px;text-align:center;padding:0 8px}
canvas{max-width:100%;height:auto;border:2px solid #333;border-radius:8px;background:#1b1b2a}
</style>
</head>
<body>
<h1>🔥 Ateş ve Su 💧</h1>
<div id="info"><b style="color:#ff7043">Ateş:</b> W A D &nbsp;|&nbsp; <b style="color:#4fc3f7">Su:</b> ← ↑ → &nbsp;|&nbsp; R: yeniden başla</div>
<canvas id="c" width="960" height="540"></canvas>
<script>
const T=30,cv=document.getElementById('c'),x=cv.getContext('2d');
function build(o){
  const g=Array.from({length:18},(_,r)=>Array.from({length:32},(_,c)=>(r==0||r==17||c==0||c==31)?'#':'.'));
  o.p.forEach(([r,a,b])=>{for(let c=a;c<=b;c++)g[r][c]='#'});
  o.h.forEach(([r,a,b,t])=>{for(let c=a;c<=b;c++)g[r][c]=t});
  return {g,...o};
}
const levels=[
 build({p:[[14,4,9],[11,11,16],[8,18,23],[5,24,30]],h:[[10,13,14,'W'],[7,20,21,'L'],[16,25,27,'G']],f:[2,16],w:[4,16],df:[28,4],dw:[29,4]}),
 build({p:[[14,3,7],[11,10,14],[8,17,21],[5,24,29]],h:[[10,11,12,'G'],[7,18,19,'W'],[4,26,27,'L'],[16,12,16,'L'],[16,19,22,'W']],f:[2,16],w:[4,16],df:[28,4],dw:[29,4]})
];
let lv=0,state='play',msg='',P=[],keys={};
function reset(){
  const L=levels[lv];
  P=[{x:L.f[0]*T+5,y:L.f[1]*T+4,w:20,h:26,vx:0,vy:0,on:false,col:'#ff5722',k:['KeyA','KeyD','KeyW'],die:'WG',door:L.df},
     {x:L.w[0]*T+5,y:L.w[1]*T+4,w:20,h:26,vx:0,vy:0,on:false,col:'#29b6f6',k:['ArrowLeft','ArrowRight','ArrowUp'],die:'LG',door:L.dw}];
  state='play';msg='Seviye '+(lv+1);
}
const tile=(px,py)=>{const r=Math.floor(py/T),c=Math.floor(px/T);return (levels[lv].g[r]||[])[c]||'#'};
function hit(p){
  for(const [dx,dy] of [[0,0],[p.w-1,0],[0,p.h-1],[p.w-1,p.h-1],[0,p.h/2],[p.w-1,p.h/2]])
    if(tile(p.x+dx,p.y+dy)=='#')return true;
  return false;
}
function step(p){
  p.vx=(keys[p.k[1]]?3.2:0)-(keys[p.k[0]]?3.2:0);
  if(keys[p.k[2]]&&p.on){p.vy=-10.5}
  p.vy=Math.min(p.vy+0.5,12);
  p.on=false;
  let n=Math.abs(Math.round(p.vx)),s=Math.sign(p.vx);
  for(let i=0;i<n;i++){p.x+=s;if(hit(p)){p.x-=s;break}}
  n=Math.abs(Math.round(p.vy));s=Math.sign(p.vy);
  for(let i=0;i<n;i++){p.y+=s;if(hit(p)){p.y-=s;if(s>0)p.on=true;p.vy=0;break}}
  const cx=p.x+p.w/2;
  for(const py of [p.y+p.h-3,p.y+p.h/2]){
    if(p.die.includes(tile(cx,py))){state='dead';msg='Öldün! R ile tekrar dene';}
  }
}
function atDoor(p){
  const c=Math.floor((p.x+p.w/2)/T),r=Math.floor((p.y+p.h/2)/T);
  return c==p.door[0]&&r==p.door[1];
}
function update(){
  if(state!='play')return;
  P.forEach(step);
  if(state=='play'&&P.every(atDoor)){
    if(lv<levels.length-1){state='won';msg='Seviye tamam! Enter ile devam'}
    else{state='end';msg='Tebrikler, oyunu bitirdiniz! R ile baştan başla'}
  }
}
const colors={'#':'#4a4a63','W':'#29b6f6','L':'#ff5722','G':'#8bc34a'};
function draw(){
  x.clearRect(0,0,960,540);
  const L=levels[lv];
  for(let r=0;r<18;r++)for(let c=0;c<32;c++){
    const t=L.g[r][c];
    if(t=='#'){x.fillStyle=colors['#'];x.fillRect(c*T,r*T,T,T);x.strokeStyle='#33334a';x.strokeRect(c*T+.5,r*T+.5,T-1,T-1)}
    else if(colors[t]){x.fillStyle=colors[t];x.fillRect(c*T,r*T+12,T,T-12)}
  }
  [[L.df,'#ff5722','🔥'],[L.dw,'#29b6f6','💧']].forEach(([d,col,e])=>{
    x.fillStyle=col;x.globalAlpha=.35;x.fillRect(d[0]*T,d[1]*T-6,T,T+6);x.globalAlpha=1;
    x.strokeStyle=col;x.lineWidth=2;x.strokeRect(d[0]*T+1,d[1]*T-5,T-2,T+4);
    x.font='18px serif';x.fillText(e,d[0]*T+5,d[1]*T+17);
  });
  P.forEach(p=>{
    x.fillStyle=p.col;x.beginPath();x.roundRect(p.x,p.y,p.w,p.h,8);x.fill();
    x.fillStyle='#fff';x.fillRect(p.x+4,p.y+7,4,5);x.fillRect(p.x+12,p.y+7,4,5);
  });
  x.fillStyle='#fff';x.font='bold 18px system-ui';x.fillText(msg,12,30);
}
addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(e.code.startsWith('Arrow'))e.preventDefault();
  if(e.code=='KeyR'){if(state=='end')lv=0;reset()}
  if(e.code=='Enter'&&state=='won'){lv++;reset()}
});
addEventListener('keyup',e=>keys[e.code]=false);
reset();
(function loop(){update();draw();requestAnimationFrame(loop)})();
</script>
</body>
</html>
